services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: printservice
      POSTGRES_USER: printservice
      POSTGRES_PASSWORD: printservice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printservice"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: printservice
      DB_USER: printservice
      DB_PASSWORD: printservice
    ports:
      - "8080:8080"